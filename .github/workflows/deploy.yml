name: Build & Deploy (GHCR → VPS)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yujimekaru/gustavoyujimekaru
  DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/root/deploy' }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
    - name: Remote deploy (SSH)
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        port: ${{ secrets.VPS_PORT }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/root/deploy' }}"

          if [ -n "${{ secrets.GHCR_PAT }}" ]; then
            docker login ghcr.io -u ${{ github.repository_owner }} -p '${{ secrets.GHCR_PAT }}'
          fi

          [ -f "$DEPLOY_DIR/gustavoyujimekaru/docker-compose.yml" ] || { echo "ERRO: $DEPLOY_DIR/gustavoyujimekaru/docker-compose.yml não existe"; exit 1; }

          cd "$DEPLOY_DIR/gustavoyujimekaru"
          docker compose --env-file ../.env pull
          docker compose --env-file ../.env up -d
          docker image prune -f